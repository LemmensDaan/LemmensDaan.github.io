<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Signal lost · Daan Lemmens</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070a1a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- the site stylesheet is pulled in for the palette, the fonts and the .btn rules -->
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .lost { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: 48px;
            min-height: 100vh; max-width: 1040px; margin: 0 auto; padding: 40px 16px; }
    .lost-text { flex: 1; max-width: 520px; }
    .lost h1 { font-size: clamp(4rem, 18vw, 9rem); line-height: .9; margin: 0; letter-spacing: -.04em; }
    .lost h2 { font-size: clamp(1.3rem, 4vw, 1.9rem); margin: 10px 0 14px; }
    .lost p { color: var(--muted); margin: 0 0 8px; }
    .code { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 22px !important; }
    /* nothing holding him: he tumbles slowly instead of hovering like the one on the home page */
    .adrift { width: clamp(140px, 22vw, 220px); image-rendering: pixelated;
              filter: drop-shadow(0 0 28px rgba(108, 140, 255, .35)); animation: adrift 14s linear infinite; }
    @keyframes adrift {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(14px, -18px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) { .adrift { animation: none; } }
    /* Far off: small and faint. It drifts, but over more than a minute and with a slow roll,
       so the movement is something you notice rather than watch. */
    .station {
      position: fixed; top: 7vh; left: 4vw; z-index: 0;
      width: clamp(24px, 3.4vw, 42px); image-rendering: pixelated; opacity: .32;
      filter: drop-shadow(0 0 6px rgba(108, 140, 255, .35));
      animation: drift 78s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: translate(0, 0) rotate(0deg); }
      to   { transform: translate(38px, -26px) rotate(8deg); }
    }
    .beacon { animation: beacon 2.6s steps(1) infinite; }
    @keyframes beacon { 0%, 42% { opacity: 1; } 43%, 100% { opacity: .12; } }
    @media (prefers-reduced-motion: reduce) { .beacon, .station { animation: none; } }
    @media (max-width: 760px) { .station { top: 3vh; left: 4vw; opacity: .28; } }
    @media (max-width: 760px) { .lost { flex-direction: column-reverse; gap: 24px; text-align: center; } .cta { justify-content: center; } }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>

  <!-- The station he has drifted away from. It sits outside the astronaut's SVG so it stays
       put while he tumbles, which is what sells the distance. -->
  <svg class="station" viewBox="0 0 16 10" shape-rendering="crispEdges" aria-hidden="true">
    <rect x="0" y="3" width="4" height="4" fill="#3b4a94"/>
    <rect x="12" y="3" width="4" height="4" fill="#3b4a94"/>
    <rect x="4" y="4" width="2" height="1" fill="#9aa3d0"/>
    <rect x="10" y="4" width="2" height="1" fill="#9aa3d0"/>
    <rect x="6" y="2" width="4" height="6" fill="#c7cdf0"/>
    <rect x="7" y="4" width="2" height="2" fill="#0b1030"/>
    <rect x="7" y="4" width="1" height="1" fill="#3fe0c5"/>
    <rect x="7" y="1" width="1" height="1" fill="#ff6b5e" class="beacon"/>
  </svg>

  <main class="lost">
    <div class="lost-text">
      <p class="kicker">&gt; signal lost_</p>
      <h1>404</h1>
      <h2>No such sector.</h2>
      <p>This page is not on any of my charts. Either the link is wrong or I moved it and forgot to leave a beacon.</p>
      <div class="cta">
        <a class="btn primary" href="/">Return to base</a>
        <a class="btn" href="/#log">Mission log</a>
        <a class="btn" href="/#contact">Contact</a>
      </div>
      <p class="code" id="path"></p>
    </div>

    <div aria-hidden="true">
      <svg viewBox="0 0 16 16" shape-rendering="crispEdges" class="adrift">
        <g fill="#0b1030"><rect x="4" y="1" width="8" height="1"/><rect x="3" y="2" width="1" height="1"/><rect x="12" y="2" width="1" height="1"/><rect x="2" y="3" width="1" height="6"/><rect x="13" y="3" width="1" height="6"/><rect x="3" y="9" width="1" height="1"/><rect x="12" y="9" width="1" height="1"/><rect x="4" y="10" width="8" height="1"/></g>
        <rect x="3" y="2" width="10" height="1" fill="#e8ecff"/><rect x="3" y="3" width="10" height="7" fill="#e8ecff"/>
        <!-- Nobody home, and the visor is gone. No face at all: a thin crack on an otherwise
             blank pane was too quiet to read, so instead a whole corner of the glass is missing
             with a ragged edge, and one fracture runs up-left out of the hole. Those are two
             large shapes rather than a scatter of single pixels, which is the only thing that
             survives being drawn 8 pixels wide. -->
        <rect x="4" y="3" width="8" height="6" fill="#9aa3d0"/>
        <rect x="4" y="3" width="2" height="1" fill="#c7cdf0"/>
        <g fill="#0b1030">
          <rect x="10" y="3" width="2" height="1"/>
          <rect x="9" y="4" width="3" height="1"/>
          <rect x="10" y="5" width="2" height="1"/>
          <rect x="9" y="6" width="3" height="1"/>
          <rect x="10" y="7" width="2" height="1"/>
          <rect x="11" y="8" width="1" height="1"/>
          <rect x="8" y="5" width="1" height="1"/>
          <rect x="7" y="4" width="1" height="1"/>
          <rect x="6" y="3" width="1" height="1"/>
        </g>
        <rect x="4" y="11" width="8" height="4" fill="#e8ecff"/><rect x="6" y="12" width="4" height="2" fill="#4a2a80"/>
        <rect x="3" y="12" width="1" height="3" fill="#c7cdf0"/><rect x="12" y="12" width="1" height="3" fill="#c7cdf0"/>
        <rect x="5" y="15" width="2" height="1" fill="#c7cdf0"/><rect x="9" y="15" width="2" height="1" fill="#c7cdf0"/>
      </svg>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';
    // which address was missed, echoed back as a console line
    var el = document.getElementById('path');
    if (el) el.textContent = 'GET ' + location.pathname + ' — 404';

    // The achievements live in localStorage under the site's own origin, so this page can add to
    // them without loading main.js; the index page renders the tile from the same store.
    try {
      var KEY = 'dl-achievements';
      var got = JSON.parse(localStorage.getItem(KEY)) || {};
      if (!got.lost) {
        got.lost = 1;
        localStorage.setItem(KEY, JSON.stringify(got));
        var toast = document.getElementById('toast');
        if (toast) {
          toast.textContent = '';
          var mark = document.createElement('i');
          mark.className = 'toast-icon';
          mark.textContent = '★';
          toast.appendChild(mark);
          toast.appendChild(document.createTextNode('Achievement unlocked: Off the map'));
          toast.classList.add('show');
          setTimeout(function () { toast.classList.remove('show'); }, 4000);
        }
      }
    } catch (e) {}

    // a lighter copy of the starfield from the main page: no scroll, no warp
    var canvas = document.getElementById('stars');
    if (!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext('2d');
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var stars = [], w = 0, h = 0;

    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      stars = [];
      for (var i = Math.round(w * h / 4500); i > 0; i--) {
        stars.push({ x: Math.random() * w, y: Math.random() * h, z: Math.random() * 0.9 + 0.1 });
      }
    }
    function paint() {
      ctx.clearRect(0, 0, w, h);
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        ctx.globalAlpha = 0.25 + s.z * 0.75;
        ctx.fillStyle = '#e8ecff';
        ctx.fillRect(s.x, s.y, 1.6 * s.z, 1.6 * s.z);
        if (!reduce) { s.y += 0.05 * s.z; if (s.y > h) s.y -= h; }
      }
      if (!reduce) requestAnimationFrame(paint);
    }
    resize();
    window.addEventListener('resize', function () { resize(); if (reduce) paint(); });
    paint();
  })();
  </script>
</body>
</html>
